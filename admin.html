<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة الإدارة</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1c2430;--mut:#6b7686;--ac:#0f6e56;--act:#fff;--bd:#dde2e8;--tk:#eceef1;--br:#fff4d6;--brt:#7a5b00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181d;--card:#1d232b;--tx:#e8ecf1;--mut:#9aa6b5;--ac:#3cc29a;--act:#06251c;--bd:#2f3844;--tk:#262d37;--br:#3a3115;--brt:#f0d98a}}
:root[data-theme="dark"]{--bg:#14181d;--card:#1d232b;--tx:#e8ecf1;--mut:#9aa6b5;--ac:#3cc29a;--act:#06251c;--bd:#2f3844;--tk:#262d37;--br:#3a3115;--brt:#f0d98a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 4px}p.s{color:var(--mut);margin:0 0 16px;font-size:14px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tabs button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--ac);color:var(--act);border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.slot{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:12px 8px;font:inherit;cursor:pointer;direction:ltr;text-align:center}
.slot:hover:not(:disabled){border-color:var(--ac)}
.slot:disabled{background:var(--tk);color:var(--mut);cursor:not-allowed;text-decoration:line-through}
.brk{grid-column:1/-1;background:var(--br);color:var(--brt);border-radius:10px;padding:10px;text-align:center;font-size:14px}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(92vw,380px);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;font-size:14px;margin:12px 0 4px}
input{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:8px;margin-top:16px}.row button{flex:1;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.row .go{background:var(--ac);color:var(--act);border-color:var(--ac)}
.msg{margin:12px 0;font-size:14px;color:var(--mut)}.err{color:#c0392b}
.ok{background:var(--card);border:1px solid var(--ac);border-radius:12px;padding:14px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:right}
.adm{margin-top:28px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}.adm h2{font-size:16px;margin:0 0 8px}
.sc{overflow-x:auto}.x{background:none;border:0;color:#c0392b;cursor:pointer;font:inherit}
</style>
</head>
<body>
<main>
<h1>لوحة الإدارة — الحجوزات</h1>
<p class="s">12/12/2026 — المعلومات هنا خاصة بالمسؤول فقط.</p>
<div id="login"><label for="pw">كلمة السر</label><input id="pw" type="password" autocomplete="current-password"><div class="row"><button class="go" id="go" type="button">دخول</button></div></div>
<div id="msg" class="msg err"></div>
<section class="adm" id="adm" hidden style="margin-top:8px">
<div class="row" style="margin-top:0"><button id="rf" type="button">تحديث</button><button id="ex" type="button">تنزيل CSV</button></div>
<p class="s" id="cnt" style="margin-top:8px"></p>
<div class="sc"><table><thead><tr><th>الموعد</th><th>الاسم</th><th>الهاتف</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);let pw="",data=[];
const API="PASTE_APPS_SCRIPT_URL_HERE";
const call=(action,pw,key)=>fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,pw,key})}).then(r=>r.json());
function draw(){const r=$("rows");r.textContent="";let last=null;
data.forEach(k=>{
if(k.booth!==last){last=k.booth;const c=data.filter(x=>x.booth===k.booth).length;const h=document.createElement("tr"),th=document.createElement("td");th.colSpan=4;th.style.cssText="font-weight:700;background:var(--tk);padding:8px";th.textContent=k.booth+" — "+c+" حجز";h.appendChild(th);r.appendChild(h)}
const tr=document.createElement("tr");[k.slot,k.name,k.phone].forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.appendChild(td)});
const td=document.createElement("td"),x=document.createElement("button");x.className="x";x.textContent="إلغاء";
x.onclick=async()=>{if(!confirm("إلغاء حجز "+k.name+"؟"))return;try{await call("adminCancel",pw,k.key);await load()}catch(e){$("msg").textContent="تعذّر الإلغاء."}};
td.appendChild(x);tr.appendChild(td);r.appendChild(tr)});
$("cnt").textContent="عدد الحجوزات: "+data.length}
async function load(){try{const j=await call("adminList",pw);if(!j.ok){$("msg").textContent="كلمة السر غير صحيحة.";$("adm").hidden=true;$("login").hidden=false;pw="";return}
data=j.rows;$("msg").textContent="";$("login").hidden=true;$("adm").hidden=false;draw()}catch(e){$("msg").textContent="تعذّر التحميل."}}
$("go").onclick=()=>{pw=$("pw").value;$("pw").value="";load()};
$("pw").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
$("rf").onclick=load;
$("ex").onclick=()=>{const q=v=>'"'+String(v).replace(/"/g,'""')+'"';const c="\ufeff"+["البوث,الموعد,الاسم,الهاتف"].concat(data.map(k=>[k.booth,k.slot,k.name,k.phone].map(q).join(","))).join("\n");
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:"text/csv;charset=utf-8"}));a.download="bookings.csv";a.click()};
setInterval(()=>{if(pw&&!document.hidden)load()},15000);
</script>
</body>
</html>
